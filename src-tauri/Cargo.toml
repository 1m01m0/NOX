[package]
name = "codex-desktop"
version = "0.1.0"
description = "Modern Native Desktop Client for OpenAI Codex"
authors = ["Codex Team"]
edition = "2021"

[[bin]]
name = "codex-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
