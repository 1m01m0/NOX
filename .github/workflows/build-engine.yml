name: 📦 Build & Release Multi-platform Kernel Engine

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'upstream-version.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-engine:
    name: Build Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: codex-app-server-darwin-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: codex-app-server-darwin-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: codex-app-server-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: codex-app-server-windows-x64.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Tauri Desktop Package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: nox-v__VERSION__
          releaseName: 'NOX v__VERSION__'
          releaseBody: 'See the assets to download this version and updated core codex kernel.'
          releaseDraft: false
          prerelease: false
