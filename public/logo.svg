<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Matte Obsidian -->
    <linearGradient id="nox-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c20" />
      <stop offset="50%" stop-color="#111114" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <!-- Chrome Border Gradient -->
    <linearGradient id="nox-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Glowing White Letter Gradient -->
    <linearGradient id="nox-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </linearGradient>

    <!-- Drop Shadow for Letters -->
    <filter id="letter-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Rounded Rect Background -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#nox-bg)" stroke="url(#nox-border)" stroke-width="12" />

  <!-- Geometric Abstract NOX Emblem -->
  <g filter="url(#letter-shadow)" transform="translate(0, 0)">
    <!-- Central Monolithic N / O / X Fusion -->
    <!-- Stylized 'N' Pillar Left -->
    <path d="M 280,300 L 360,300 L 360,724 L 280,724 Z" fill="url(#nox-glow)" />

    <!-- Diagonal Slash forming N and intersecting X -->
    <path d="M 360,300 L 664,724 L 744,724 L 440,300 Z" fill="url(#nox-glow)" />

    <!-- Stylized 'N' Pillar Right / X leg -->
    <path d="M 664,300 L 744,300 L 744,724 L 664,724 Z" fill="url(#nox-glow)" />

    <!-- Center Precision Dot / Portal -->
    <circle cx="512" cy="512" r="32" fill="#111114" stroke="#ffffff" stroke-width="10" />
  </g>
</svg>
